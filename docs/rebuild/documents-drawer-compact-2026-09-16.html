<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Documents - Compact Drawer Studies</title>
    <link rel="stylesheet" href="./documents-drawer-compact.css" />
  </head>
  <body data-compact="true">
    <main class="page">
      <header class="comparison-header">
        <div>
          <strong>Documents</strong
          ><span class="prototype-label">Design studies · 02</span>
        </div>
        <div class="theme-picker" role="group" aria-label="Color theme">
          <button type="button" data-theme-choice="light" aria-pressed="true">
            Light
          </button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">
            Dark
          </button>
        </div>
      </header>
      <nav class="design-picker" aria-label="Drawer designs">
        <button type="button" data-design="folio" aria-pressed="true">
          <small>01</small>Section Tabs
        </button>
        <button type="button" data-design="index" aria-pressed="false">
          <small>02</small>Side Index
        </button>
        <button type="button" data-design="sequence" aria-pressed="false">
          <small>03</small>Guided Steps
        </button>
        <button type="button" data-design="workspace" aria-pressed="false">
          <small>04</small>Split Workspace
        </button>
        <button type="button" data-design="outline" aria-pressed="false">
          <small>05</small>Inline Outline
        </button>
      </nav>
      <section class="stage">
        <div class="catalog-context" aria-label="Document catalog">
          <div class="catalog-header">
            <h1>Documents</h1>
            <span>Document settings</span>
          </div>
          <div class="context-toolbar">
            <span>All document types</span><span>Search documents</span>
          </div>
          <div class="catalog-row catalog-columns">
            <span>Document name</span><span>Requirement</span>
          </div>
          <div class="catalog-row selected">
            <span>Driver safety certificate</span><span>Conditional</span>
          </div>
          <div class="catalog-row">
            <span>Food handler permit</span><span>Required</span>
          </div>
          <div class="catalog-row">
            <span>Emergency contact form</span><span>Optional</span>
          </div>
        </div>
        <div class="drawer-shell" id="drawerShell"></div>
      </section>
      <div class="comparison-footer">
        <span>Synthetic preview · Changes stay in this page</span>
        <div>
          <button type="button" id="longDescription">Long description</button
          ><button type="button" id="resetPreview">Reset preview</button>
        </div>
      </div>
      <div hidden>
        <span id="metricMode"></span><span id="metricAudience"></span
        ><span id="metricDeadline"></span>
      </div>
    </main>
    <template id="formTemplate">
      <form class="drawer" novalidate>
        <header class="drawer-header">
          <div>
            <small>EDIT DOCUMENT <span class="draft-status">Draft</span></small>
            <h2>Driver safety certificate</h2>
          </div>
          <button
            type="button"
            class="icon-button"
            aria-label="Close document editor"
            data-close
            title="Close"
          >
            ×
          </button>
        </header>
        <div class="body"></div>
        <footer class="drawer-footer">
          <div class="msg" role="status" aria-live="polite"></div>
          <div class="button-row">
            <button class="btn" type="button" data-action="cancel">
              Cancel</button
            ><button class="btn primary" type="submit">Save draft</button>
          </div>
        </footer>
      </form>
    </template>
    <script src="./documents-drawer-prototype-core.js"></script>
    <script src="./documents-drawer-compact.js"></script>
  </body>
</html>
