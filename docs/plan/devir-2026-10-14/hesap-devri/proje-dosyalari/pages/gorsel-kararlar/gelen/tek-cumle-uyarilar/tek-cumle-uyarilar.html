<title>Tek cümlelik uyarılar</title>
<meta name="claude:viewport-fit-sides" content="cover">

/* Layout: left list of the 17 places; right a place's card, switches, and two live frames (desktop 1280, phone 390).

:root{

  --theme-focus:#177a64;--theme-text-secondary:#50605a;--theme-danger-soft:#fff0ee;--theme-danger-text:#653b36;--theme-danger:#b84234;
  --theme-list-frame:#d7dcda;--theme-list-head:#e6ece8;--theme-list-head-text:#4f5d57;--theme-warning-soft:#fff7e2;--theme-warning-text:#5f491f;

}
*{box-sizing:border-box}
body{margin:0;background:var(--theme-page);color:var(--theme-text);font:14px/1.45 var(--sans)}
button{font:inherit}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}

.menu h1{font-size:19px;margin:0 6px 6px;text-wrap:balance}
.menu .lead{margin:0 6px 16px;color:var(--theme-muted);font-size:13px}

.menu h2 span{background:var(--theme-surface-muted);border-radius:999px;padding:0 7px;font-size:11px;color:var(--theme-text-secondary)}
.menu .gnote{margin:0 6px 6px;color:var(--theme-muted);font-size:12px}
.menu button.item{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--theme-text)}

.xbtn{width:30px;height:30px;border:1px solid var(--theme-border);border-radius:6px;display:grid;place-items:center;color:var(--theme-text-secondary);background:var(--theme-surface)}

// n = {icon,title,text,action,primary}; size L (whole area) | M (inside drawer/panel/window) | S (one row)
function decided(n){ // LoadError C: already decided (Mert: "Evet, ikisi de C")
  return `<section class="cC"><span class="icirc load" style="width:56px;height:56px">${svg('cloud',26)}</span><div class="t"><h2>${n.title}</h2><p>${n.text}</p><p style="color:var(--theme-text-body)">Check your connection, then try again.</p></div><span class="btn-w">${svg('refresh',15)} Try again</span></section>`;
}
function notice(v,n,size,phone){
  if(n.decided) return decided(n);
  const btn = n.action ? (size==='L'||n.primary ? `<span class="btn-g">${n.action}</span>` : `<span class="btn-w">${n.action}</span>`) : '';
  if(v==='A'){
    if(size==='L') return `<section class="cC"><span class="icirc" style="width:56px;height:56px">${svg(n.icon,26)}</span><div class="t"><h2>${n.title}</h2><p>${n.text}</p></div>${btn}</section>`;
    if(size==='M') return `<section class="vA-M"><span class="icirc" style="width:48px;height:48px">${svg(n.icon,22)}</span><div class="t"><h3>${n.title}</h3><p>${n.text}</p></div>${btn}</section>`;
    return `<p class="vA-S">${svg(n.icon,15)}<span>${n.title}</span></p>`;
  }
  if(v==='B'){
    if(size==='S') return `<p class="vB-S">${svg(n.icon,14)}<span>${n.title}</span></p>`;
    return `<section class="vB${size==='M'&&n.flush?' inset':''}"><span class="icirc" style="width:48px;height:48px">${svg(n.icon,22)}</span><h3>${n.title}</h3><p>${n.text}</p>${n.action?`<span class="btn-w">${n.action}</span>`:''}</section>`;
  }
  if(v==='C'){
    if(size==='S') return `<p class="vC-S"><span style="color:var(--theme-accent-deep);display:flex">${svg(n.icon,15)}</span><span>${n.title}</span></p>`;
    return `<section class="vC"><span class="ic">${svg(n.icon,20)}</span><div class="t"><b>${n.title}</b><p>${n.text}</p></div>${n.action?`<span class="btn-w">${n.action}</span>`:''}</section>`;
  }
}

    const back=`<div class="hub"><div class="hubh">Good afternoon, Alex</div><p style="margin:0 0 16px;color:var(--theme-muted);font-size:13px">Your next shift is Friday at 5 PM.</p><div class="sxcard"><b>Fri 5 PM – 11 PM</b><div style="color:var(--theme-muted)">Server · Downtown</div></div><div class="sxcard"><b>Sat 11 AM – 4 PM</b><div style="color:var(--theme-muted)">Server · Downtown</div></div></div>`;
    let sh;
    if(showOrig) sh=p.origHtml();
    else if(v==='A') sh=`<div class="sh"><span></span>${X}</div>${notice('A',p.n,'M').replace('padding:40px 28px','')}`.replace('class="btn-g"','class="eh-primary" style="align-self:stretch"');
    else if(v==='B') sh=`<div class="sh"><span></span>${X}</div>${notice('B',p.n,'M')}`;
    else sh=`<div class="sh"><h2 style="font-size:18px">Shift</h2>${X}</div>${notice('C',p.n,'M')}`;
    return {back, over:`<div class="sheetback"><div class="sheet">${sh}</div></div>`};
  }
  if(ctx==='window'){
    const back=header('','Schedule','Week of Oct 12 – 18 · Downtown')+table(['Employee','Mon','Tue','Wed','Thu'],[['Alex Kim','5–11','','5–11',''],['Dana Lee','','11–4','','11–4'],['Sam Ortiz','8–2','8–2','','8–2']],'1.4fr 1fr 1fr 1fr 1fr');
    const wb=showOrig?p.origHtml():`<button class="backlink">${svg('back',14)} All templates</button><div style="margin-top:12px">${notice(v,{...p.n,action:v==='C'?'All templates':null},'M')}</div>`;
    return {back, over:`<div class="dim"></div><div class="win"><div class="wh"><b>New schedule</b>${X}</div><div class="wt"><span>Blank</span><span>Copy a week</span><span class="on">Templates</span></div><div class="wb">${wb}</div></div>`};
  }
  return null;
}
function settingsCtx(p,phone){
  const showOrig=v==='O';
  const N=(s)=>notice(v,p.n,s||p.size,phone);
  let main='';
  if(p.ctx==='setsection'){
    const inner=showOrig?`<div style="padding:0 24px 20px">${p.origHtml()}</div>`:`<div style="padding:0 24px 20px">${v==='A'?N('M').replace('padding:40px 28px','padding:24px 12px'):N('M')}</div>`;
    main=header('','Schedule rules','How Schedule checks hours, breaks and availability.')+`<div class="card"><div style="padding:18px 24px 10px"><b>Overtime</b><p style="margin:2px 0 0;color:var(--theme-muted);font-size:13px">Warn after 40 hours a week.</p></div></div><div class="card" style="margin-top:14px"><div style="padding:18px 24px 12px"><b>${p.sect}</b><p style="margin:2px 0 0;color:var(--theme-muted);font-size:13px">${p.sdesc}</p></div>${inner}</div>`;
  }
  if(p.ctx==='rows'){
    const line=showOrig?p.origHtml():N('S');
    main=header('','General','Name, time zone and how your workspace starts up.')+`<div class="card"><div style="padding:16px 24px"><b>Workspace name</b><p style="margin:2px 0 0;color:var(--theme-muted);font-size:13px">Harbor &amp; Vine</p></div><div class="srow"><div><b>Setup checklist</b><p>Shows the first steps on Workspace.</p></div><span class="ghostbtn">Hide checklist</span></div>${line}<div class="srow"><div><b>Preferred names</b><p>When someone asks to use another name.</p></div><span class="ghostbtn">Answer them here</span></div>${line}</div>`;
  }
  if(p.ctx==='roles'){
    const inner=showOrig?p.origHtml():`<div style="padding:0 20px">${v==='A'?N('M'):N('M')}</div>`;
    const list=`<div class="rl"><span>Owner</span><span>Admin</span><span>Manager</span><span>Shift Lead</span></div>`;
    main=header('','Roles & permissions','Who can see and change what.')+(phone?`<div class="rp"><div class="rt"><span>Permissions</span><span>People</span></div>${inner}</div>`:`<div class="rolelist">${list}<div class="rp"><div class="rt"><span>Permissions</span><span>People</span></div>${inner}</div></div>`);
  }
  if(p.ctx==='jobs'){
    const tbl=table(['Job','Department','People'],[['Server','Front of house','12'],['Host','Front of house','4'],['Line cook','Kitchen','9']],phone?'1.2fr 1fr .5fr':'1.6fr 1.2fr .6fr');
    main=header('WORKSPACE','Jobs','The jobs people work, grouped by department.')+`<div class="tool"><span>Active 3</span><span>Archived 1</span></div>`+tbl+(showOrig?p.origHtml():'');
    if(!showOrig){
      const inner=v==='A'?N('M'):`<div class="inset-pad">${N('M')}</div>`;
      return {main, over:`<div class="dim"></div><div class="drawer"><div class="dh"><b>Job</b>${X}</div><div class="db">${inner}</div></div>`};
    }
  }
  return {main};
}

function screenHtml(p,phone){
  const kind=p.kind;
  const isSettings=['setsection','rows','roles','jobs'].includes(p.ctx);
  const ov=overlayCtx(p,phone);
  if(isSettings){
    const r=settingsCtx(p,phone);
    const on={setsection:'Schedule rules',rows:'General',roles:'Roles & permissions',jobs:'Jobs'}[p.ctx];
    if(phone) return phoneShell(kind,p.active,`<div style="display:flex;gap:14px;overflow:hidden;white-space:nowrap;font-size:12px;color:var(--theme-text-secondary);margin:-6px 0 14px">${['General','Locations','Jobs','Schedule rules','Roles & permissions'].map(n=>`<span style="${n===on?'color:var(--theme-accent-deep);font-weight:700':''}">${n}</span>`).join('')}</div>${r.main}${r.over||''}`);
    return deskShell(kind,p.active,`<div class="setrail" style="margin:-26px -32px;height:calc(100% + 52px)">${settingsRail(on)}<div style="padding:26px 32px;position:relative;overflow:hidden">${r.main}${r.over||''}</div></div>`);
  }
  if(ov){
    const inner=ov.back+ov.over;
    return phone?phoneShell(kind,p.active,inner):deskShell(kind,p.active,inner);
  }
  let inner=body(p,phone);
  if(p.id==='desk'&&v!=='O') inner=inner; // card already centered
  if(kind==='emp'&&p.ctx!=='sx') inner=`<div class="hub">${inner}</div>`;
  return phone?phoneShell(kind,p.active,inner):deskShell(kind,p.active,inner);
}

/* ---------- page ---------- */
function renderMenu(){
  const groups=[...new Set(P.map(p=>p.g))];
  document.getElementById('menu').innerHTML=groups.map(g=>{
    const items=P.filter(p=>p.g===g);
    return `<h2>${g}<span>${items.length}</span></h2>`+items.map(p=>`<button class="item" type="button" data-id="${p.id}" aria-current="${p.id===cur}"><b>${p.name}</b><small>${p.where.split(' (')[0]}</small></button>`).join('');
  }).join('');
  document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{cur=b.dataset.id;save();render()});
}
function seg(el,opts,val,set){el.innerHTML=opts.map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k===val}">${l}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{set(b.dataset.k);save();render()})}
function save(){try{localStorage.setItem('tcu',JSON.stringify({cur,v,f:fmode}))}catch(e){}}
function fit(){
  document.querySelectorAll('.scaler').forEach(s=>{
    const sc=s.firstElementChild,w=+s.dataset.w,h=+s.dataset.h,max=+s.dataset.max;
    let avail=max;if(!s.closest('.pframe')){const fr=document.getElementById('frames');const ph=fr.querySelector('.pframe')?380:0;let room=fr.clientWidth-ph;if(room<520)room=fr.clientWidth;avail=Math.min(max,room-2);}
    const k=Math.min(1,avail/w);
    sc.style.transform=`scale(${k})`;s.style.width=(w*k)+'px';s.style.height=(h*k)+'px';
  });
}
function render(){
  const p=P.find(x=>x.id===cur);
  renderMenu();
  document.getElementById('grp').textContent=p.g;
  document.getElementById('ttl').textContent=p.name;
  const n=p.n;
  const newCopy=n.decided?`<b>${n.title}</b> · ${n.text} · Try again`:`<b>${n.title}</b>${n.text?' · '+n.text:''}${n.action?' · düğme: '+n.action:''}`;
  document.getElementById('facts').innerHTML=
    `<dt>Nerede</dt><dd>${p.where}</dd><dt>Ne zaman çıkar</dt><dd>${p.when}</dd><dt>Kim görür</dt><dd>${p.who}</dd>`+
    `<dt>Bugün nasıl</dt><dd>${p.orig}</dd><dt>Yeni metin</dt><dd>${newCopy}${n.decided?' <span class="tag done">Karar verildi: "We couldn\'t load" kartı C (Mert)</span>':''}</dd>`+
    (p.own?`<dt>Sahibi</dt><dd><span class="tag own">${p.own}</span></dd>`:'')+`<dt>Kod</dt><dd><code>apps/web/src/${p.code}</code></dd>`;
  seg(document.getElementById('segV'),VARS.map(x=>[x[0],x[1]]),v,k=>v=k);
  seg(document.getElementById('segF'),[['both','Masaüstü + Telefon'],['desk','Masaüstü'],['phone','Telefon']],fmode,k=>fmode=k);
  document.getElementById('vnote').innerHTML=VARS.find(x=>x[0]===v)[2]+(n.decided&&v!=='O'?'<div class="copy">Bu yer yükleme hatası: üç varyantta da kararlaştırılmış C görünümlü "We couldn\'t load" kartı çıkar.</div>':'')+`<div class="copy">Metin üç varyantta aynı; yalnız görünüm değişir. Bilinmeyen kayıt ile yetki dışı kayıt aynı cümleyi alır ("isn't available"), kaydın var olup olmadığı söylenmez.</div>`;
  const fr=document.getElementById('frames');let h='';
  const showD=fmode!=='phone',showP=fmode!=='desk';
  if(showD){
    h+= p.only==='phone'
      ? `<div><p class="fcap"><b>Masaüstü</b></p><div class="none">Bu uyarı masaüstünde çıkmaz: Schedule bilgisayarda açılır.</div></div>`
      : `<div style="flex:0 1 auto;min-width:0"><p class="fcap"><b>Masaüstü</b> 1280 × 780</p><div class="dframe"><div class="chrome"><i></i><i></i><i></i>&nbsp;app.newfork.com</div><div class="scaler" data-w="1280" data-h="780" data-max="1000"><div class="screen" style="width:1280px;height:780px">${screenHtml(p,false)}</div></div></div></div>`;
  }
  if(showP){
    h+= p.only==='desktop'
      ? `<div><p class="fcap"><b>Telefon</b></p><div class="none">Bu uyarı telefonda çıkmaz: Schedule telefonda kapalı.</div></div>`
      : `<div style="flex:0 0 auto"><p class="fcap"><b>Telefon</b> 390 × 780</p><div class="pframe"><div class="scaler" data-w="390" data-h="780" data-max="330"><div class="screen phone" style="width:390px;height:780px">${screenHtml(p,true)}</div></div></div></div>`;
  }
  fr.innerHTML=h;fit();
}
addEventListener('resize',fit);
render();
</script>
