<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome to Newfork</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;background:#ffffff;color:#1d2525;-webkit-font-smoothing:antialiased}
a{color:#12624f}a:hover{color:#176954}
.pb{display:flex;flex-direction:column;width:1440px;height:900px;background:#ffffff;color:#1d2525}
.pb-top{display:flex;align-items:center;justify-content:space-between;gap:20px;height:62px;flex:0 0 62px;padding:0 32px;border-bottom:1px solid #dce3df;background:#ffffff;box-sizing:border-box}
.pb-who{display:flex;align-items:center;gap:14px;min-width:0}
.pb-who .av{display:grid;place-items:center;width:28px;height:28px;flex:0 0 28px;border-radius:999px;background:#e7f1ed;color:#12624f;font-size:11px;font-weight:700}
.pb-who .mail{font-size:12.5px;color:#66716c}
.pb-topnote{max-width:560px;font-size:12px;line-height:1.45;color:#8d9793;text-align:right}
.pb-btn-tiny{min-height:32px;padding:0 12px;font-size:12.5px}
.pb-brand{color:#12624f;font-size:13px;font-weight:800;letter-spacing:.08em}
.pb-account{display:flex;flex-direction:column;align-items:stretch;gap:14px;min-width:0}
.pb-account-id{display:grid;min-width:0;color:#66716c;font-size:12px;line-height:1.35}
.pb-account-id strong{color:#17221e;font-size:13px}
.pb-account-id span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-body{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 32px;box-sizing:border-box}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:560px;box-sizing:border-box;padding:88px 88px 56px;border:1px solid #dce3df;border-radius:10px;background:#ffffff;text-align:center}
.card h1{margin:0;font-size:26px;line-height:1.2;font-weight:600;color:#17221e}
.card .pb-description{margin:0;max-width:384px;font-size:14px;line-height:1.55;color:#66716c}
.pb-stack{display:grid;gap:10px;width:100%;margin-top:16px}
.pb-btn{display:inline-flex;min-height:36px;align-items:center;justify-content:center;gap:7px;padding:0 14px;border:1px solid transparent;border-radius:7px;font:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;text-decoration:none;box-sizing:border-box}
.pb-btn-primary{background:#176954;color:#ffffff}
.pb-btn-secondary{border-color:#cbd4d0;background:#ffffff;color:#17221e}
.pb-btn-block{width:100%;min-height:40px;font-size:13.5px}
.sidenote{font-size:11.5px;color:#66716c;line-height:1.5}
</style>
</helmet>
<div class="pb">
  <header class="pb-top">
    <span class="pb-brand">NEWFORK</span>
    <span class="pb-who"><span class="av">AN</span><span class="mail">alexa@newfork.test</span><button type="button" class="pb-btn pb-btn-secondary pb-btn-tiny">Sign out</button></span>
  </header>
  <div class="pb-body">
    <main class="card" aria-labelledby="nb-t">
      <h1 id="nb-t">Welcome to Newfork</h1>
      <p class="pb-description">Start your own workspace, or join one that invited you.</p>
      <div class="pb-stack">
        <button type="button" class="pb-btn pb-btn-primary pb-btn-block">Create a workspace</button>
        <button type="button" class="pb-btn pb-btn-secondary pb-btn-block">Find my invitation</button>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
