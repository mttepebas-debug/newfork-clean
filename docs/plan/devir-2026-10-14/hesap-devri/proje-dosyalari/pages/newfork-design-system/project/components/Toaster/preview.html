<!-- @dsCard group="Feedback" height=400 subtitle="Four types, static rendition" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  .stack { display: grid; gap: 10px; justify-content: center; padding: 24px; }
</style>
</head>
<body>
  <div class="stack">
    <div class="newfork-toast" data-type="success" role="status">
      <span class="toast-type-icon success" aria-hidden="true">✓</span>
      <div><div class="toast-title">Schedule published</div><div class="toast-description">Ayşe and 11 others were notified.</div></div>
      <button class="toast-close" type="button" aria-label="Close">✕</button>
    </div>
    <div class="newfork-toast" data-type="error" role="status">
      <span class="toast-type-icon error" aria-hidden="true">✕</span>
      <div><div class="toast-title">Couldn't publish the schedule</div><div class="toast-description">Check your connection and try again.</div></div>
      <button class="toast-close" type="button" aria-label="Close">✕</button>
    </div>
    <div class="newfork-toast" data-type="warning" role="status">
      <span class="toast-type-icon warning" aria-hidden="true">!</span>
      <div><div class="toast-title">2 shifts overlap time off</div><div class="toast-description">Review them before publishing.</div></div>
      <button class="toast-close" type="button" aria-label="Close">✕</button>
    </div>
    <div class="newfork-toast" data-type="info" role="status">
      <span class="toast-type-icon info" aria-hidden="true">i</span>
      <div><div class="toast-title">Draft saved</div></div>
      <button class="toast-close" type="button" aria-label="Close">✕</button>
    </div>
  </div>
</body>
</html>
