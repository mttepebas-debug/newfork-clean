<!-- @dsCard group="Actions" height=150 subtitle="Idle and armed, static rendition" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  .grid { display: grid; grid-template-columns: max-content max-content; gap: 12px 16px; align-items: center; padding: 24px; }
  .label { color: var(--theme-muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="grid">
    <button class="nf-button danger-button" type="button">Delete shift</button>
    <button class="nf-button danger-button is-armed" type="button" data-confirming="true">Confirm delete</button>
    <button class="nf-button danger-text-button" type="button">Remove</button>
    <button class="nf-button danger-text-button is-armed" type="button" data-confirming="true">Confirm remove</button>
    <span class="label">First click arms</span>
    <span class="label">Second click confirms; disarms after 3.2 s</span>
  </div>
</body>
</html>
