/* Layout: left menu of every screen that shows the error, right the real app (desktop 1440 + phone 390). */
/* Light only, like the app itself; values are newfork's --theme-* tokens. */
:root {
  color-scheme: light;
  --page: #f4f5f3; --surface: #ffffff; --soft: #f0f3f1; --text: #17221e; --body: #1d2525;

  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, Consolas, "SF Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); }
body { color: var(--text); font-family: var(--font); font-size: 14px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

/* Menu */
.menu { border-right: 1px solid var(--border); background: var(--surface); padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
@media (max-width: 900px) { .menu { position: static; height: auto; max-height: 46vh; border-right: 0; border-bottom: 1px solid var(--border); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.menu h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; text-wrap: balance; }
.menu .sub { margin: 0 0 16px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.group { margin-top: 18px; }
.group h2 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.group h2 .n { font-variant-numeric: tabular-nums; background: var(--soft); border-radius: 999px; padding: 1px 7px; letter-spacing: 0; }
.group p { margin: 0 0 8px; font-size: 12px; color: var(--muted); line-height: 1.45; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.item { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 7px; padding: 7px 9px; cursor: pointer; display: grid; gap: 1px; }
.item:hover { background: var(--soft); }
.item[aria-current="true"] { background: var(--accent-soft); }
.item .t { font-weight: 600; font-size: 13.5px; }
.item[aria-current="true"] .t { color: var(--accent); }
.item .w { font-size: 12px; color: var(--muted); line-height: 1.35; }

/* Viewer */
.main { min-width: 0; padding-block: 22px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; align-content: start; }
@media (min-width: 901px) { .main { padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); } }
.head { display: grid; gap: 8px; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); }
.head h2 { margin: 0; font-size: 24px; letter-spacing: -0.015em; text-wrap: balance; }
.quote { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 6px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font-weight: 600; color: var(--body); overflow-wrap: anywhere; }
.quote svg { flex: none; color: var(--lock); }
.facts { margin: 0; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; max-width: 120ch; font-size: 13.5px; line-height: 1.5; }
.facts dt { font-weight: 650; color: var(--muted); }
.facts dd { margin: 0; color: var(--body); min-width: 0; overflow-wrap: anywhere; }
.facts code { font: 12.5px var(--mono); background: var(--soft); padding: 1px 6px; border-radius: 5px; }
@media (max-width: 600px) { .facts { grid-template-columns: 1fr; } .facts dd { margin-bottom: 6px; } }
.controls { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.pills { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; }
.pills button { min-height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.pills button[aria-pressed="true"] { background: var(--text); color: var(--on-dark); }
.pills button:disabled { opacity: 0.45; cursor: not-allowed; }
.ghost { min-height: 32px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; }
.ghost:hover { background: var(--soft); }
.vnote { margin: 0; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); font-size: 13.5px; line-height: 1.55; color: var(--body); max-width: 120ch; }
.vnote b { color: var(--text); }

.frames { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.frames[data-layout="side"] { grid-template-columns: minmax(0, 1fr) auto; }
.dev { display: grid; gap: 8px; min-width: 0; }
.dev-label { font-size: 12px; font-weight: 650; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.dev-label span { font-weight: 400; font-variant-numeric: tabular-nums; }
.screen-desk { position: relative; width: 100%; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; background: var(--surface); box-shadow: 0 1px 2px rgba(23, 34, 30, 0.06); }
.screen-desk .bar { height: 26px; background: var(--soft); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; padding: 0 10px; }
.screen-desk .bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); }
.screen-desk .bar b { margin-left: 10px; font: 11.5px var(--mono); font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewport { position: relative; overflow: hidden; }
.viewport iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: var(--page); display: block; }
.screen-phone { width: 414px; max-width: 100%; padding: 12px; border-radius: 38px; background: var(--bezel); box-shadow: 0 1px 2px rgba(23, 34, 30, 0.12); }
.screen-phone .viewport { border-radius: 27px; background: var(--page); }
.empty-note { padding: 20px; border: 1px dashed var(--border-strong); border-radius: 10px; color: var(--muted); background: var(--surface); line-height: 1.5; }
.legend { font-size: 12.5px; color: var(--muted); line-height: 1.5; max-width: 110ch; margin: 0; }
</style>

    </div>
  </main>
</div>
