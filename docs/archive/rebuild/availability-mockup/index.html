<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newfork | Availability tasarim incelemesi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e9e7;font:13px/1.5 'Segoe UI',sans-serif;color:#202a27;letter-spacing:0}.review{background:#172521;color:#fff;padding:12px 22px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}.review strong{font-size:15px}.review small{color:#bbc9c2}.controls{padding:12px 22px;background:#fff;border-bottom:1px solid #cad3ce;display:flex;gap:16px;align-items:end;flex-wrap:wrap}label{display:grid;gap:4px;font-size:11px;color:#59655f}select,button{font:13px 'Segoe UI',sans-serif;border:1px solid #ccd5cf;background:white;border-radius:5px;padding:8px 10px;color:#202a27;min-height:36px}button{cursor:pointer}.stage{padding:20px;display:flex;justify-content:center}iframe{border:1px solid #c5cec8;border-radius:6px;background:#fff;width:100%;height:calc(100vh - 190px);min-height:600px;box-shadow:0 10px 35px #23362b15;transition:width .15s}.note{margin-left:auto;font-size:12px;color:#637069}.screen-label{color:#d1dcd6}button:hover{background:#edf3ee}@media(max-width:600px){.review{padding:10px 12px;gap:8px}.controls{padding:10px 12px;gap:8px}.controls label{flex:1;min-width:120px}.note{display:none}.stage{padding:8px}iframe{min-height:650px;height:78vh}}
</style></head><body>
<header class="review"><strong>NEWFORK <span class="screen-label">/ Availability</span></strong><small>Tiklanabilir tasarim incelemesi · Ornek veriler</small></header>
<div class="controls">
<label>Ekran<select id="view"><option value="employee">Calisan · Availability</option><option value="manager">Manager · Employee drawer</option><option value="team">Takim · Availability</option><option value="onboarding">Onboarding</option><option value="settings">Settings</option><option value="schedule">Schedule & Preflight</option><option value="lineup">Line Up · Aday arama</option></select></label>
<label>Giris modu<select id="mode"><option value="shift">Shift type</option><option value="time">Saat araligi</option></select></label>
<label>Drawer<select id="layout"><option value="tabs">Iki sekme · secildi</option><option value="stack">Ust uste bolumler</option></select></label>
<label>Mobil editor<select id="flow"><option value="scroll">Yatay kaydir · secildi</option><option value="wrap">Alt satira gec</option></select></label>
<label>All day<select id="allday"><option value="switch">Anahtar · secildi</option><option value="check">Onay kutusu</option></select></label>
<label>Gorunum<select id="size"><option value="desktop">Desktop</option><option value="390">Mobil · 390px</option><option value="320">Mobil · 320px</option></select></label>
<button id="reset" title="Ornek verileri sifirla">Ornegi sifirla</button><span class="note">Secimler gercek uygulamaya kaydedilmez.</span>
</div><div class="stage"><iframe id="preview" title="Availability interactive preview"></iframe></div>
<script>
const keys=['view','mode','layout','flow','allday']; const p=new URLSearchParams(location.search);keys.forEach(k=>{if(p.has(k))document.getElementById(k).value=p.get(k)});
function refresh(){let q=new URLSearchParams;keys.forEach(k=>q.set(k,document.getElementById(k).value));document.getElementById('preview').src='preview.html?'+q;document.getElementById('preview').style.width=document.getElementById('size').value==='desktop'?'100%':document.getElementById('size').value+'px';history.replaceState(null,'','?'+q)}
document.querySelectorAll('select').forEach(s=>s.onchange=()=>s.id==='size'?document.getElementById('preview').style.width=s.value==='desktop'?'100%':s.value+'px':refresh());document.getElementById('reset').onclick=()=>{document.getElementById('preview').contentWindow.postMessage('reset-demo','*')};refresh();
</script></body></html>
