name: CI

on:
  push:
    branches: [main, "task/**"]
    # Docs-only pushes used to cancel a running code check (concurrency below).
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Los_Angeles # tests assume local dev TZ (ScheduleExportSchedules)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # no .nvmrc/engines; LTS, matches local
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ponytail: concurrency=1 only in CI to avoid load flakiness; local scripts unchanged
      - run: pnpm run lint --concurrency=1
      - run: pnpm run typecheck --concurrency=1
      - run: pnpm run test --concurrency=1
      - run: pnpm run build --concurrency=1
